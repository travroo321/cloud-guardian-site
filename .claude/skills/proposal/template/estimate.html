<!-- CLOUD GUARDIAN PRIVATE ESTIMATE BUILDER — generated by the proposal skill.
     Everything on this page is driven by the JSON in #cg-deal below. To change
     a rate, a tier or a project, edit that block; the page rebuilds itself.
     Do not hand-edit the markup or the engine. -->
<script id="cg-deal" type="application/json">
{{DEAL_JSON}}
</script>

<section class="hero" style="min-height:auto; padding-bottom:24px;">
  <div class="hero-grid"></div>
  <div class="hero-inner" style="grid-template-columns:1fr;">
    <div class="hero-single">
      <div class="hero-tag"><span class="tag-emoji">🔑</span> Prepared for {{CLIENT_NAME}} · Private estimate</div>
      <h1>BUILD YOUR <span>ESTIMATE.</span></h1>
      <p class="hero-sub" style="max-width:790px;">{{INTRO}}</p>
    </div>
  </div>
</section>

<section id="estimate" class="vs-band">
  <div class="section-inner">
    <span class="section-tag reveal">Your Options</span>
    <h2 class="reveal">PICK WHAT<br/><span style="color:var(--cyan)">YOU NEED.</span></h2>
    <div class="sq reveal" id="cg">
      <div class="sq-form" id="cg-form"></div>
      <div class="sq-out" id="cg-out"></div>
    </div>
  </div>
</section>

<script>
/* ── Cloud Guardian estimate engine ───────────────────────────────────────
   Renders an interactive, per-prospect estimate from the #cg-deal config.
   Written plainly on purpose: a salesperson should be able to read the JSON
   and know exactly what the prospect will see.                            */
(function () {
  var host = document.getElementById('cg');
  if (!host) return;

  var D;
  try { D = JSON.parse(document.getElementById('cg-deal').textContent); }
  catch (e) { host.innerHTML = '<p class="sq-note">This estimate is misconfigured. Call (732) 743-5472 and we will send a corrected link.</p>'; return; }

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var money = function (n) {
    var neg = n < 0, a = Math.abs(n);
    return (neg ? '−$' : '$') + a.toLocaleString('en-US',
      { minimumFractionDigits: (a % 1 ? 2 : 0), maximumFractionDigits: 2 });
  };
  var $ = function (id) { return document.getElementById(id); };
  var num = function (id, lo, hi) { var v = parseFloat($(id).value); if (isNaN(v)) v = lo; return Math.max(lo, Math.min(hi, v)); };

  /* ── build the form ── */
  var f = [], step = 0;
  f.push('<div class="sq-field"><label for="cg-biz">Company name</label>' +
         '<input type="text" id="cg-biz" value="' + esc(D.client) + '" autocomplete="organization" /></div>');

  var models = [];
  if (D.support && D.support.enabled !== false) models.push('tiers');
  if (D.hourly && D.hourly.enabled !== false) models.push('hourly');

  if (models.length) {
    step++;
    f.push('<div class="sq-field"><label>' + step + '. How do you want ongoing support handled?</label>');

    if (models.indexOf('tiers') > -1) {
      var rateLine = (D.support.tiers || []).map(function (t) {
        return '$' + t.rate + ' ' + esc(t.short || t.label.toLowerCase());
      }).join(' &nbsp;·&nbsp; ');
      f.push('<label class="cg-opt" id="cg-opt-tiers"><span class="cg-opt-head">' +
             '<input type="radio" name="cg-model" value="tiers" id="cg-m-tiers" checked />' +
             '<span><span class="cg-opt-t">' + esc(D.support.title || 'Unlimited IT support') + '</span>' +
             '<span class="cg-opt-p">' + rateLine + ' &nbsp;<span style="color:#8fa0b4">per user / month</span></span>' +
             '<span class="cg-opt-d">' + esc(D.support.blurb || '') + '</span></span></span></label>');
      var sub = ['<div class="cg-sub" id="cg-tier-fields">'];
      (D.support.tiers || []).forEach(function (t) {
        sub.push('<div class="sq-field"><label for="cg-' + t.id + '">' + esc(t.label) +
                 ' <span class="sq-val" id="cg-' + t.id + '-v">' + (t.default || 0) + '</span></label>' +
                 '<input type="range" class="sq-range" id="cg-' + t.id + '" min="0" max="' + (t.max || 60) +
                 '" value="' + (t.default || 0) + '" step="1" />' +
                 '<span class="sq-hint">$' + t.rate + ' each per month. ' + esc(t.hint || '') + '</span></div>');
      });
      sub.push('<div id="cg-coverage" class="cg-cov"></div>');
      if (D.support.note) sub.push('<p class="cg-note"><strong style="color:#c3ced9">Why everyone is on the list.</strong> ' + esc(D.support.note) + '</p>');
      if (D.support.escalation) sub.push('<p class="cg-note"><strong style="color:#c3ced9">Moving people between tiers.</strong> ' + esc(D.support.escalation) + '</p>');
      sub.push('</div>');
      f.push(sub.join(''));
    }

    if (models.indexOf('hourly') > -1) {
      var h = D.hourly;
      f.push('<label class="cg-opt" id="cg-opt-hourly"><span class="cg-opt-head">' +
             '<input type="radio" name="cg-model" value="hourly" id="cg-m-hourly"' + (models[0] === 'hourly' ? ' checked' : '') + ' />' +
             '<span><span class="cg-opt-t">Pay as you go, hourly</span>' +
             '<span class="cg-opt-p">Onsite $' + h.onsite + ' / hour &nbsp;·&nbsp; Remote break/fix $' + h.remote + ' / hour</span>' +
             '<span class="cg-opt-d">No monthly fee and no onboarding fee. Onsite visits carry a ' + (h.onsiteMin || 1) +
             '-hour minimum, then bill hourly. Remote break/fix bills in ' + Math.round((h.remoteStep || 0.5) * 60) +
             '-minute increments, so ' + (h.remoteStep === 0.5 ? 'a half hour' : (h.remoteStep + ' of an hour')) +
             ' is ' + money(h.remote * (h.remoteStep || 0.5)) + '.</span></span></span></label>' +
             '<div class="cg-sub" id="cg-hourly-fields" hidden>' +
             '<div class="sq-field"><label for="cg-visits">Onsite visits in a typical month <span class="sq-val" id="cg-visits-v">1</span></label>' +
             '<input type="range" class="sq-range" id="cg-visits" min="0" max="12" value="1" step="1" /></div>' +
             '<div class="sq-field"><label for="cg-vhrs">Hours per onsite visit <span class="sq-val" id="cg-vhrs-v">2</span></label>' +
             '<input type="range" class="sq-range" id="cg-vhrs" min="1" max="8" value="2" step="1" />' +
             '<span class="sq-hint">' + (h.onsiteMin || 1) + '-hour minimum per visit at $' + h.onsite + ' an hour.</span></div>' +
             '<div class="sq-field"><label for="cg-rem">Remote hours in a typical month <span class="sq-val" id="cg-rem-v">2</span></label>' +
             '<input type="range" class="sq-range" id="cg-rem" min="0" max="20" value="2" step="' + (h.remoteStep || 0.5) + '" />' +
             '<span class="sq-hint">Billed in ' + Math.round((h.remoteStep || 0.5) * 60) + '-minute blocks, ' + money(h.remote * (h.remoteStep || 0.5)) + ' each.</span></div></div>');
    }

    f.push('<label class="cg-opt" id="cg-opt-none"><span class="cg-opt-head">' +
           '<input type="radio" name="cg-model" value="undecided" id="cg-m-none" />' +
           '<span><span class="cg-opt-t">Not sure yet</span>' +
           '<span class="cg-opt-p">Let\'s work it out on the call</span>' +
           '<span class="cg-opt-d">Leave support out of the estimate for now. We will walk through the options with you.</span></span></span></label>');
    f.push('</div>');
  }

  if (D.projects && D.projects.length) {
    step++;
    f.push('<div class="sq-field"><label>' + step + '. One-time work</label>');
    D.projects.forEach(function (p) {
      f.push('<label class="cg-opt" id="cg-opt-' + p.id + '"><span class="cg-opt-head">' +
             '<input type="checkbox" id="cg-p-' + p.id + '"' + (p.checked ? ' checked' : '') + ' />' +
             '<span><span class="cg-opt-t">' + esc(p.label) + '</span>' +
             '<span class="cg-opt-p">' + (typeof p.price === 'number' ? money(p.price) + ' one time' : esc(p.price)) +
             (p.scope ? ', ' + esc(p.scope) : '') + '</span>' +
             '<span class="cg-opt-d">' + esc(p.blurb || '') + '</span></span></span></label>');
    });
    f.push('</div>');
  }

  if (D.licensing && D.licensing.enabled !== false) {
    step++;
    f.push('<div class="sq-field"><label>' + step + '. ' + esc(D.licensing.title || 'Email licensing') +
           ' <span class="sq-opt">' + esc(D.licensing.payee || 'paid to the vendor, not to us') + '</span></label>' +
           '<p class="cg-note" style="margin-top:0">' + esc(D.licensing.blurb || '') + '</p><div class="cg-lic-grid" id="cg-lic-grid">' +
           '<button type="button" class="cg-lic" data-plan="none" data-price="0" data-flex="0"><b>None / already have it</b><i>&mdash;</i><small>Leave licensing out</small></button>');
    (D.licensing.plans || []).forEach(function (pl, i) {
      f.push('<button type="button" class="cg-lic' + (i === (D.licensing.defaultIndex == null ? 1 : D.licensing.defaultIndex) ? ' on' : '') +
             '" data-plan="' + esc(pl.name) + '" data-price="' + pl.price + '" data-flex="' + (pl.flex || pl.price) + '">' +
             '<b>' + esc(pl.name) + '</b><i>' + money(pl.price) + ' / user / mo</i><small>' + esc(pl.note || '') + '</small></button>');
    });
    f.push('</div><div class="sq-field" id="cg-lic-fields"><label for="cg-seats">Mailboxes to license ' +
           '<span class="sq-val" id="cg-seats-v">' + (D.licensing.seatsDefault || 8) + '</span></label>' +
           '<input type="range" class="sq-range" id="cg-seats" min="1" max="60" value="' + (D.licensing.seatsDefault || 8) + '" step="1" />' +
           '<span class="sq-hint">' + esc(D.licensing.hint || '') + '</span></div></div>');
  }

  step++;
  f.push('<div class="sq-field"><label for="cg-notes">' + step + '. Questions for the follow-up meeting <span class="sq-opt">optional</span></label>' +
         '<textarea id="cg-notes" rows="4" maxlength="2000" placeholder="Anything you want us to come prepared to answer. What is breaking, what you are paying now, timing, anything you are unsure about..."></textarea></div>');
  $('cg-form').innerHTML = f.join('');

  /* ── build the output panel ── */
  var o = ['<span class="sq-out-label">Your estimate</span>',
    '<div class="cg-tot big"><span>Cloud Guardian, per month</span><b id="cg-monthly">$0</b></div>',
    '<div class="cg-tot"><span>Cloud Guardian, one time</span><b id="cg-once">$0</b></div>'];
  if (D.licensing && D.licensing.enabled !== false)
    o.push('<div class="cg-tot lic"><span>' + esc(D.licensing.payeeShort || 'Licensing') + ', per month</span><b id="cg-lic-tot">$0</b></div>');
  if (D.compare && D.compare.currentMonthly > 0)
    o.push('<div class="cg-tot save" id="cg-save-row"><span>Against your ' + esc(D.compare.label || 'current provider') + '</span><b id="cg-save">—</b></div>');
  o.push('<div class="sq-break" id="cg-break"></div>');
  o.push('<div class="cg-excl"><b>What this excludes.</b> ' + esc(D.excludes ||
    'Third-party email licensing is not included in our pricing. Hardware, cabling and any project work outside what you picked is quoted separately, always before the work happens.') + '</div>');
  o.push('<p class="sq-note">This is an estimate, not an invoice. Hourly work is tracked to the minute and itemized. We confirm the real number with you after a free look at what you have, and nothing gets billed that you have not already seen.</p>');
  o.push('<div class="cg-noprint"><div class="sq-contact" style="display:block">' +
    '<label for="cg-name">Your name</label><input type="text" id="cg-name" autocomplete="name" />' +
    '<label for="cg-reach">Email or phone number</label><input type="text" id="cg-reach" autocomplete="email" /></div>' +
    '<button type="button" class="btn-primary sq-send" id="cg-send" style="width:100%">Send this estimate to Cloud Guardian</button>' +
    '<p class="sq-sent" id="cg-sent" hidden></p>' +
    '<button type="button" class="btn-outline sq-pdf" id="cg-print" style="width:100%">Save or print a copy</button>' +
    '<a class="phone-link" href="tel:+17327435472">&#128222; (732) 743-5472</a></div>');
  $('cg-out').innerHTML = o.join('');

  /* ── licensing plan selection ── */
  var plan = { name: 'none', price: 0, flex: 0 };
  var lg = $('cg-lic-grid');
  if (lg) {
    var on = lg.querySelector('.cg-lic.on');
    if (on) plan = { name: on.dataset.plan, price: +on.dataset.price, flex: +on.dataset.flex };
    [].forEach.call(lg.querySelectorAll('.cg-lic'), function (b) {
      b.addEventListener('click', function () {
        [].forEach.call(lg.querySelectorAll('.cg-lic'), function (x) { x.classList.toggle('on', x === b); });
        plan = { name: b.dataset.plan, price: +b.dataset.price, flex: +b.dataset.flex };
        recalc();
      });
    });
  }

  function currentModel() {
    var r = host.querySelector('input[name="cg-model"]:checked');
    return r ? r.value : 'undecided';
  }

  function recalc() {
    var m = currentModel(), monthly = 0, once = 0, lic = 0, rows = [], covered = 0;

    if ($('cg-tier-fields')) { $('cg-tier-fields').hidden = (m !== 'tiers'); $('cg-opt-tiers').classList.toggle('on', m === 'tiers'); }
    if ($('cg-hourly-fields')) { $('cg-hourly-fields').hidden = (m !== 'hourly'); $('cg-opt-hourly').classList.toggle('on', m === 'hourly'); }
    if ($('cg-opt-none')) $('cg-opt-none').classList.toggle('on', m === 'undecided');

    if (m === 'tiers') {
      (D.support.tiers || []).forEach(function (t) {
        var n = num('cg-' + t.id, 0, t.max || 60);
        covered += n;
        if (n > 0) { monthly += n * t.rate; rows.push([esc(t.label) + ', ' + n + ' x $' + t.rate, n * t.rate]); }
      });
      if (covered === 0) rows.push(['No users entered yet', 0]);
    } else if (m === 'hourly') {
      var h = D.hourly;
      var visits = num('cg-visits', 0, 12), vhrs = Math.max(h.onsiteMin || 1, num('cg-vhrs', 1, 8)), rem = num('cg-rem', 0, 20);
      if (visits > 0) { monthly += visits * vhrs * h.onsite; rows.push(['Onsite, ' + visits + ' visit' + (visits === 1 ? '' : 's') + ' x ' + vhrs + ' hr x $' + h.onsite, visits * vhrs * h.onsite]); }
      if (rem > 0) { monthly += rem * h.remote; rows.push(['Remote break/fix, ' + rem + ' hr x $' + h.remote, rem * h.remote]); }
      if (!visits && !rem) rows.push(['Nothing estimated for a typical month', 0]);
    } else {
      rows.push(['Ongoing support, to be decided on the call', 0]);
    }

    var creditSource = null;
    (D.projects || []).forEach(function (p) {
      var on = $('cg-p-' + p.id) && $('cg-p-' + p.id).checked;
      if ($('cg-opt-' + p.id)) $('cg-opt-' + p.id).classList.toggle('on', !!on);
      if (on && typeof p.price === 'number') {
        once += p.price;
        rows.push([esc(p.label) + ' (one time)', p.price]);
        if (D.onboarding && D.onboarding.creditedBy === p.id) creditSource = p.short || p.label.toLowerCase();
      } else if (on) {
        rows.push([esc(p.label) + ' (one time)', esc(p.price)]);
      }
    });

    if (D.onboarding && D.onboarding.fee && m === 'tiers') {
      once += D.onboarding.fee;
      rows.push(['Onboarding, one time', D.onboarding.fee]);
      if (creditSource) { once -= D.onboarding.fee; rows.push(['Onboarding credited against your ' + esc(creditSource), -D.onboarding.fee]); }
    }

    var seats = $('cg-seats') ? num('cg-seats', 1, 60) : 0;
    if ($('cg-lic-fields')) $('cg-lic-fields').hidden = (plan.price <= 0);
    if (plan.price > 0) {
      lic = seats * plan.price;
      rows.push([esc(plan.name) + ', ' + seats + ' user' + (seats === 1 ? '' : 's') + ' x ' + money(plan.price), lic]);
    }

    monthly = +monthly.toFixed(2); once = +once.toFixed(2); lic = +lic.toFixed(2);
    $('cg-monthly').textContent = money(monthly);
    $('cg-once').textContent = money(once);
    if ($('cg-lic-tot')) $('cg-lic-tot').textContent = money(lic);

    if ($('cg-save')) {
      var theirs = D.compare.currentMonthly, ours = monthly + (D.compare.includeLicensing ? lic : 0);
      var diff = theirs - ours;
      $('cg-save').textContent = diff > 0 ? money(diff) + ' less' : (diff === 0 ? 'the same' : money(-diff) + ' more');
      $('cg-save-row').classList.toggle('good', diff > 0);
    }

    var cov = $('cg-coverage');
    if (cov) {
      if (m !== 'tiers' || !seats) { cov.className = 'cg-cov'; cov.innerHTML = ''; }
      else if (covered < seats) {
        cov.className = 'cg-cov warn';
        cov.innerHTML = '<b>' + covered + ' of ' + seats + ' covered.</b> ' + (seats - covered) +
          ' account' + (seats - covered === 1 ? '' : 's') + ' with no protection on them.';
      } else { cov.className = 'cg-cov ok'; cov.innerHTML = '<b>All ' + covered + ' covered.</b> Every account with access is on the security stack.'; }
    }

    var html = '';
    rows.forEach(function (r) {
      html += '<div class="calc-line"><span>' + r[0] + '</span><span>' + (typeof r[1] === 'number' ? money(r[1]) : r[1]) + '</span></div>';
    });
    if (m === 'tiers' && seats && covered < seats) {
      var floor = (D.support.tiers || []).reduce(function (a, t) { return Math.min(a, t.rate); }, Infinity);
      html += '<div class="calc-flag warn">You are licensing ' + seats + ' mailbox' + (seats === 1 ? '' : 'es') +
        ' but covering ' + covered + '. That leaves ' + (seats - covered) + ' machine' + (seats - covered === 1 ? '' : 's') +
        ' that can reach company mail with nothing protecting it. $' + floor + ' a user is the floor for those, which would add ' +
        money((seats - covered) * floor) + ' a month.</div>';
    }
    if (creditSource && m === 'tiers') html += '<div class="calc-flag">Your ' + money(D.onboarding.fee) + ' onboarding is credited off in full. ' + esc(D.onboarding.creditNote || '') + '</div>';
    if (plan.price > 0 && plan.flex && plan.flex !== plan.price)
      html += '<div class="calc-flag">' + esc(plan.name) + ' at ' + money(plan.price) + ' per user is the annual-commitment rate, ' +
        money(seats * plan.price * 12) + ' a year. Month to month it is ' + money(plan.flex) + ' per user, ' + money(seats * plan.flex) + ' a month.</div>';
    $('cg-break').innerHTML = html;
    return { monthly: monthly, once: once, lic: lic, seats: seats, covered: covered, rows: rows, model: m };
  }

  host.querySelectorAll('input[type=range]').forEach(function (el) {
    el.addEventListener('input', function () { var v = $(el.id + '-v'); if (v) v.textContent = el.value; recalc(); });
  });
  host.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(function (el) {
    el.addEventListener('change', recalc);
  });
  $('cg-print').addEventListener('click', function () { window.print(); });

  $('cg-send').addEventListener('click', function () {
    var msg = $('cg-sent'), reach = ($('cg-reach').value || '').trim();
    msg.hidden = false;
    if (!reach) { msg.classList.add('err'); msg.textContent = 'Add an email or phone number so we can get back to you.'; return; }
    var q = recalc(), picked = [];
    if (q.model === 'tiers') (D.support.tiers || []).forEach(function (t) { picked.push(num('cg-' + t.id, 0, t.max || 60) + ' x ' + t.label + ' ($' + t.rate + ')'); });
    else if (q.model === 'hourly') picked.push('Pay as you go: ' + num('cg-visits', 0, 12) + ' visit(s) x ' + num('cg-vhrs', 1, 8) + ' hr onsite, ' + num('cg-rem', 0, 20) + ' remote hr');
    else picked.push('Undecided');
    var proj = (D.projects || []).filter(function (p) { return $('cg-p-' + p.id) && $('cg-p-' + p.id).checked; }).map(function (p) { return p.label; });
    var body = {
      _subject: 'ESTIMATE - ' + (($('cg-biz').value || D.client).trim()) + ' - ' + money(q.monthly) + '/mo' + (q.once ? ' + ' + money(q.once) + ' one time' : ''),
      name: ($('cg-name').value || '').trim(), contact: reach, company: ($('cg-biz').value || D.client).trim(),
      support: picked.join('; '), one_time: proj.length ? proj.join('; ') : 'none',
      onboarding: (D.onboarding && q.model === 'tiers') ? ('$' + D.onboarding.fee + (proj.length && D.onboarding.creditedBy ? ', credited off' : '')) : 'n/a',
      licensing: plan.price > 0 ? plan.name + ', ' + q.seats + ' users = ' + money(q.lic) + '/mo' : 'none selected',
      coverage: q.model === 'tiers' && q.seats ? q.covered + ' of ' + q.seats + ' accounts covered' : 'n/a',
      monthly: money(q.monthly), one_time_total: money(q.once), licensing_monthly: money(q.lic),
      questions_for_the_meeting: ($('cg-notes').value || '').trim() || 'none',
      page: location.pathname
    };
    msg.classList.remove('err'); msg.textContent = 'Sending...';
    fetch('https://formspree.io/f/xkoezydq', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error(); msg.textContent = 'Sent. We have your picks and your questions, and we will come to the meeting ready for them.'; })
      .catch(function () { msg.classList.add('err'); msg.textContent = 'That did not go through. Call (732) 743-5472 or email sales@cloud-guardian.com and we will pick it up from there.'; });
  });

  recalc();
})();
</script>
